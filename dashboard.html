<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Welcome</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
    }
    #liquid-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .welcome {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      font-size: 3rem;
      font-weight: bold;
      color: white;
    }
  </style>
</head>
<body>
  <canvas id="liquid-bg"></canvas>
  <div class="welcome">🚀 Welcome to Your Dashboard</div>

  <script>
    // Basic animated gradient background using Three.js
    const canvas = document.getElementById("liquid-bg");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.Camera();
    const geometry = new THREE.PlaneGeometry(2, 2);

    // Simple shader gradient
    const material = new THREE.ShaderMaterial({
      uniforms: {
        time: { value: 0.0 },
        colors: { value: [ new THREE.Color('#5227FF'), new THREE.Color('#FF9FFC'), new THREE.Color('#B19EEF') ] }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float time;
        uniform vec3 colors[3];
        varying vec2 vUv;
        void main() {
          float wave = sin(vUv.x * 10.0 + time) * 0.5 + 0.5;
          vec3 color = mix(colors[0], colors[1], wave);
          color = mix(color, colors[2], vUv.y);
          gl_FragColor = vec4(color, 1.0);
        }
      `
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    function animate() {
      material.uniforms.time.value += 0.02;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener("resize", () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
