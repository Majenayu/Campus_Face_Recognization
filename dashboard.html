<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dream Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
   <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

</head>
<body class="bg-gray-900 text-white min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Face Match Dashboard</h1>
        
        <div class="bg-gray-800 p-6 rounded-xl shadow-lg mb-8">
            <label class="block mb-2 text-sm">Paste Google Drive Folder Link:</label>
            <div class="flex gap-4">
                <input id="driveLink" type="text" placeholder="https://drive.google.com/drive/folders/..." 
                       class="flex-1 p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="startScan()" id="scanBtn" class="bg-blue-600 px-6 py-3 rounded font-bold hover:bg-blue-700 transition">Start Scan</button>
            </div>
            <p id="status" class="mt-4 text-blue-400 font-medium"></p>
        </div>

        <h2 class="text-xl mb-4">Matches Found</h2>
        <div id="results" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            </div>
    </div>

    <script>
        let faceMatcher = null;
        const userEmail = localStorage.getItem("userEmail");

        if (!userEmail) window.location.href = "/";

        // 1. Load AI Models and User Face on Page Load
      async function init() {
    const scanBtn = document.getElementById('scanBtn');
    scanBtn.disabled = true; // Disable button while loading
    
    document.getElementById('status').innerText = "⏳ Loading AI models...";
    const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
    
    try {
        await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

        document.getElementById('status').innerText = "⏳ Fetching your profile face...";
        
        const res = await fetch('/user-faces', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email: userEmail })
        });
        const data = await res.json();

        if (data.success && data.faces.length > 0) {
            const img = await faceapi.fetchImage(data.faces[0]);
            const detections = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
            
            if (detections) {
                faceMatcher = new faceapi.FaceMatcher(detections);
                document.getElementById('status').innerText = "✅ Ready to scan.";
                scanBtn.disabled = false; // Re-enable button
            }
        }
    } catch (err) {
        document.getElementById('status').innerText = "❌ Initialization error.";
        console.error(err);
    }
}
        // 2. The Scanning Logic
        async function startScan() {
            const link = document.getElementById('driveLink').value;
            const status = document.getElementById('status');
            const resultsDiv = document.getElementById('results');

            if (!link) return alert("Please paste a link");
            
            status.innerText = "🔍 Connecting to Google Drive...";
            
            try {
                // Ask server to get list of file IDs from Drive
                const res = await fetch('/scan-drive', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ driveLink: link, email: userEmail, clientSide: true })
                });
                const data = await res.json();

                if (!data.success) throw new Error(data.error);

                status.innerText = `📸 Found ${data.files.length} photos. Starting face match...`;

                for (let file of data.files) {
                    // This tells the browser to ask your server for the image instead of Google
const imageUrl = `/proxy-image?id=${file.id}`;
                   

                    
                    try {
                        const img = await faceapi.fetchImage(imageUrl);
                        const displaySize = { width: img.width, height: img.height };
                        const detections = await faceapi.detectAllFaces(img).withFaceLandmarks().withFaceDescriptors();

                        const results = detections.map(d => faceMatcher.findBestMatch(d.descriptor));

                        if (results.some(r => r.label !== 'unknown')) {
                            status.innerText = "🔥 Face found! Saving match...";
                            displayMatch(imageUrl);
                            // Tell server to save this match to Cloudinary
                            fetch('/save-match', {
                                method: 'POST',
                                headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({ email: userEmail, imageUrl: imageUrl })
                            });
                        }
                    } catch (e) {
                        console.log("Skipping a file (possibly too large or not an image)");
                    }
                }
                status.innerText = "✅ Scan complete!";
            } catch (err) {
                status.innerText = "❌ Error: " + err.message;
            }
        }

        function displayMatch(url) {
            const img = document.createElement('img');
            img.src = url;
            img.className = "w-full h-48 object-cover rounded-lg border-2 border-green-500 shadow-md";
            document.getElementById('results').appendChild(img);
        }

    // This waits for the window and all scripts to be fully loaded
window.onload = () => {
    init().catch(err => console.error("Initialization failed:", err));
};    
    </script>
</body>
</html>
